<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="André Nascimento Silva - SOC, Blue Team, Malware Analysis e Vulnerability Research" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#1f9bd7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2535" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)" opacity="0.6"/>
  <rect x="0" y="0" width="8" height="300" rx="4" fill="url(#accent)"/>

  <!-- janela de terminal -->
  <circle cx="48" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="68" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="88" cy="38" r="6" fill="#27c93f"/>

  <text x="48" y="92" class="mono" font-size="18" fill="#2ea043">$ whoami</text>

  <text x="48" y="150" class="sans" font-size="54" font-weight="700" fill="#e6edf3">André Nascimento Silva</text>

  <rect x="48" y="166" width="180" height="4" rx="2" fill="url(#accent)"/>

  <text x="48" y="206" class="sans" font-size="24" fill="#9fb3c8">Defesa Cibernética  •  SOC &amp; Blue Team</text>
  <text x="48" y="244" class="mono" font-size="18" fill="#1f9bd7">Malware Analysis  |  Vulnerability Research  |  Threat Detection</text>

  <text x="48" y="276" class="mono" font-size="18" fill="#2ea043">&gt; open to work: estágio / trainee / júnior</text>
  <rect class="cursor" x="520" y="262" width="10" height="18" fill="#2ea043"/>
</svg>
